<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Credicel POS V18.6 - Dark Dashboard Edition + LÁSER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modo Oscuro Dashboard Premium */
        html, body { height: 100%; margin: 0; padding: 0; background: #090c15; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; color: #f8fafc;}
        .app-container { display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available;}
        header { flex-shrink: 0; z-index: 50; padding-top: env(safe-area-inset-top, 0.75rem);}
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 0.8rem; padding: 1.2rem;}
        
        /* Tarjetas de Producto - Estilo Dashboard Tile */
        .product-card { transition: all 0.2s ease; border: 1px solid #1e293b; cursor: pointer; user-select: none; display: flex; flex-direction: column; justify-content: space-between; height: 135px; background: #111827; border-radius: 1rem; padding: 1rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4);}
        .product-card:hover { border-color: #10b981; background: #1f2937; transform: translateY(-2px);}
        .product-card:active { transform: scale(0.95); background-color: #064e3b; border-color: #047857;}
        
        /* Encabezado Dashboard */
        .dark-gradient { background: #0b0f19; border-bottom: 1px solid #1e293b; box-shadow: 0 4px 20px rgba(0,0,0,0.3);}
        
        /* Sidebar Dashboard */
        .sidebar { transition: transform 0.3s ease-in-out; width: 85%; max-width: 350px; position: fixed; inset: 0 auto 0 0; z-index: 300; background: #0f172a; border-right: 1px solid #1e293b; box-shadow: 15px 0 30px rgba(0,0,0,0.8);}
        .sidebar.closed { transform: translateX(-100%);}
        .content-main { flex: 1; display: flex; overflow: hidden;}
        .scroll-area { overflow-y: auto; -webkit-overflow-scrolling: touch;}
        #loading { display: flex; transition: opacity 0.3s ease;}
        
        /* Scrollbar minimalista */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @media (max-width: 768px) { .content-main { flex-direction: column; } .cart-panel { width: 100% !important; height: 45%; border-left: 0; border-top: 1px solid #1e293b;} }
    </style>
</head>
<body class="text-slate-100">

    <div id="loading" class="fixed inset-0 bg-[#090c15]/90 z-[600] flex items-center justify-center text-emerald-400 font-black uppercase text-center backdrop-blur-md">
        <div class="p-8 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl">
            <div class="animate-spin h-12 w-12 border-4 border-emerald-500 border-t-transparent rounded-full mx-auto mb-4"></div>
            SINCRO MATRIZ...<br>
            <span class="text-xs font-bold opacity-60 tracking-widest text-slate-400">Iniciando Sistema</span>
        </div>
    </div>

    <div class="app-container">
        <header class="dark-gradient text-white flex flex-wrap gap-3 items-center justify-between p-4">
            <div class="flex flex-wrap gap-3 items-center">
                <button onclick="toggleSidebar()" class="bg-slate-800/80 border border-slate-700 text-emerald-400 hover:bg-slate-700 px-4 py-3 rounded-xl font-black text-xs uppercase shadow-md active:scale-90 transition backdrop-blur-sm">CORTE</button>
                <button onclick="modalEquipo()" class="bg-emerald-600/90 hover:bg-emerald-500 text-white border border-emerald-500 px-4 py-3 rounded-xl font-black text-xs uppercase shadow-md shadow-emerald-900/30 active:scale-90 transition backdrop-blur-sm">EQUIPO</button>
                
                <input type="text" id="scanner-input" class="bg-[#1e293b] border border-slate-700 text-emerald-400 px-4 py-3 rounded-xl font-black text-xs uppercase shadow-inner outline-none focus:border-emerald-500 transition w-48 placeholder-slate-500" placeholder="🔍 ESCANEAR..." autocomplete="off">
                <div id="admin-tools" class="hidden flex flex-wrap gap-2">
                    <button onclick="ajusteInv('ENTRADA')" class="bg-slate-800/80 border border-slate-700 text-emerald-300 px-4 py-3 rounded-xl font-black text-xs uppercase shadow-sm">Entrada</button>
                    <button onclick="ajusteInv('SALIDA')" class="bg-slate-800/80 border border-red-900/50 text-red-400 px-4 py-3 rounded-xl font-black text-xs uppercase shadow-sm">Ajuste</button>
                    <button onclick="ajusteInv('TRASPASO')" class="bg-slate-800/80 border border-slate-700 text-emerald-300 px-4 py-3 rounded-xl font-black text-xs uppercase shadow-sm">Traspaso</button>
                </div>
            </div>
            <div class="text-right">
                <div id="v-nom" class="font-black uppercase text-xs leading-none text-slate-100"></div>
                <div id="v-suc" class="font-bold text-emerald-400 text-[10px] uppercase mt-1 tracking-wider"></div>
            </div>
        </header>

        <div class="content-main">
            <main class="flex-1 scroll-area bg-[#090c15]">
                <div class="products-grid" id="grid"></div>
            </main>

            <aside class="cart-panel w-96 bg-[#0f172a] border-l flex flex-col shadow-2xl border-slate-800">
                <div class="p-6 border-b text-center shrink-0 border-slate-800 bg-[#0b0f19]/50">
                    <div class="text-5xl font-black text-emerald-400 leading-none mb-4 tracking-tight">$<span id="t-v">0.00</span></div>
                    <button onclick="abrirCobro()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-5 rounded-2xl font-black text-xl shadow-lg shadow-emerald-900/40 uppercase active:scale-95 transition border border-emerald-500">Cobrar</button>
                    <button onclick="limpiarVenta()" class="mt-4 text-xs text-slate-500 hover:text-slate-300 font-bold underline uppercase transition tracking-wider">Limpiar Carrito</button>
                </div>
                <div id="carrito" class="flex-1 scroll-area p-4 space-y-3 bg-[#0f172a]"></div>
            </aside>
        </div>
    </div>

    <div id="modal-login" class="fixed inset-0 bg-[#090c15]/95 z-[400] flex items-center justify-center p-4 backdrop-blur-xl">
        <div class="w-full max-w-md border border-slate-800 p-8 rounded-3xl shadow-2xl text-center bg-[#0f172a]">
            <h1 class="text-5xl font-black text-white italic mb-8 uppercase tracking-wide">Credi<span class="text-emerald-500">cel</span></h1>
            <select id="sel-u" class="w-full p-5 border border-slate-700 rounded-xl mb-4 font-bold text-xl bg-[#1e293b] text-slate-200 outline-none focus:border-emerald-500 transition shadow-inner"></select>
            <select id="sel-s" class="w-full p-5 border border-slate-700 rounded-xl mb-4 font-bold text-xl bg-[#1e293b] text-slate-200 outline-none focus:border-emerald-500 transition shadow-inner">
                <option>Navojoa</option><option>Huatabampo</option><option>Bodega</option>
            </select>
            <input id="pin" type="password" inputmode="numeric" maxlength="6" class="w-full p-5 border border-slate-700 rounded-xl text-center text-3xl tracking-[15px] mb-6 outline-none bg-[#1e293b] text-white placeholder-slate-500 focus:border-emerald-500 transition shadow-inner" placeholder="****">
            <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 border border-emerald-500 text-white py-6 rounded-2xl font-black text-xl uppercase shadow-lg shadow-emerald-900/30 active:scale-95 transition">Entrar al Sistema</button>
        </div>
    </div>

    <div id="modal-cobro" class="fixed inset-0 bg-[#090c15]/95 hidden items-center justify-center p-4 z-[500] backdrop-blur-xl">
        <div class="bg-[#0f172a] rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border border-slate-800">
            <h2 class="text-3xl font-black mb-6 text-slate-100 uppercase italic">Finalizar Cobro</h2>
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button onclick="quickPay(100)" class="bg-[#1e293b] border border-slate-700 py-5 rounded-xl font-black text-xl text-emerald-400 hover:bg-slate-700 hover:border-emerald-500 transition">$100</button>
                <button onclick="quickPay(200)" class="bg-[#1e293b] border border-slate-700 py-5 rounded-xl font-black text-xl text-emerald-400 hover:bg-slate-700 hover:border-emerald-500 transition">$200</button>
                <button onclick="quickPay(500)" class="bg-[#1e293b] border border-slate-700 py-5 rounded-xl font-black text-xl text-emerald-400 hover:bg-slate-700 hover:border-emerald-500 transition">$500</button>
            </div>
            <input type="number" id="pago-cliente" oninput="calcCambio()" class="w-full p-5 border border-slate-700 rounded-xl text-center text-4xl font-black mb-6 outline-none bg-[#1e293b] text-white focus:border-emerald-500 transition shadow-inner" placeholder="0.00">
            <div class="p-5 bg-[#064e3b]/30 border border-emerald-800/50 rounded-xl mb-6 text-emerald-100 font-black">
                <p class="text-xs uppercase opacity-70 leading-none mb-1 text-emerald-300">Cambio a entregar:</p>
                <p class="text-5xl">$ <span id="cambio-v">0.00</span></p>
            </div>
            <button onclick="finalizarVenta()" class="w-full py-5 bg-emerald-600 hover:bg-emerald-500 border border-emerald-500 text-white rounded-xl font-black text-xl uppercase shadow-lg shadow-emerald-900/40 transition active:scale-95">Registrar Venta</button>
            <button onclick="cerrarCobro()" class="mt-6 text-xs font-bold underline uppercase block mx-auto text-slate-500 hover:text-slate-300 tracking-wider">Volver al carrito</button>
        </div>
    </div>

    <div id="sidebar" class="sidebar closed p-6 flex flex-col shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-black text-xl text-slate-100 uppercase italic tracking-wide">Resumen Turno</h2>
            <button onclick="toggleSidebar()" class="text-4xl font-light text-slate-500 hover:text-emerald-400 transition">&times;</button>
        </div>
        <div id="corte-lista" class="flex-1 scroll-area text-xs font-bold text-slate-400 space-y-3"></div>
        <div class="p-5 bg-[#0b0f19] border border-slate-800 rounded-2xl my-4 text-left shadow-inner" id="total-corte"></div>
        <button onclick="enviarCorte()" class="w-full bg-red-900/80 hover:bg-red-800 border border-red-800 text-red-100 py-5 rounded-xl font-black uppercase text-sm shadow-lg transition active:scale-95">Cerrar Turno Oficial</button>
    </div>

    <script>
        const URL = "https://script.google.com/macros/s/AKfycbwey07xR5IRAAyP5EhkcEM-AYXKKYycxTL6HUsSwnFM1xdvhmAHkNepmTN8K_CHSAxh6Q/exec";
        let USERS = [], PRODS = [], carrito = [], vNom = "", vSuc = "", corte = {};
        
        window.onload = async () => {
            try {
                const res = await fetch(URL + "?action=getUsers");
                if (!res.ok) throw new Error('Network error');
                USERS = await res.json();
                document.getElementById('sel-u').innerHTML = USERS.map(u => `<option>${u.nombre}</option>`).join('');
                const memoU = localStorage.getItem('lastU'), memoS = localStorage.getItem('lastS');
                if(memoU) document.getElementById('sel-u').value = memoU;
                if(memoS) document.getElementById('sel-s').value = memoS;
                
                const backup = localStorage.getItem('backup_venta');
                if(backup) { carrito = JSON.parse(backup); actualizar(); }
                
                const backupCorte = localStorage.getItem('backup_corte');
                if(backupCorte) { corte = JSON.parse(backupCorte); }
            } catch (e) { 
                console.error(e);
                alert("Error al conectar con Matriz."); 
            } finally { 
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 300); 
            }
        };

        async function login() {
            const u = USERS.find(x => x.nombre.trim() == document.getElementById('sel-u').value.trim());
            if(u && u.pin.trim() == document.getElementById('pin').value.trim()) {
                vNom = u.nombre;
                vSuc = document.getElementById('sel-s').value;
                localStorage.setItem('lastU', vNom); localStorage.setItem('lastS', vSuc);
                if(vNom.toLowerCase() == "said") document.getElementById('admin-tools').classList.remove('hidden');
                
                document.getElementById('modal-login').style.display = 'none';
                document.getElementById('v-nom').innerText = vNom; document.getElementById('v-suc').innerText = vSuc;
                document.getElementById('loading').style.display = 'flex'; document.getElementById('loading').style.opacity = '1';
                
                try {
                    const res = await fetch(URL + "?action=getProducts");
                    PRODS = await res.json();
                    PRODS.push({id:'ABONO', n:'ABONO CRÉDITO', p:0}, {id:'REP', n:'REPARACIÓN/VAR', p:0}, {id:'GAS', n:'GASTO INTERNO', p:0}, {id:'RECARGA', n:'RECARGA SALDO', p:0});
                    pintar();
                } catch (e) { alert("Error al cargar productos."); }
                
                document.getElementById('loading').style.display = 'none';
                // Enfocar escáner al entrar
                setTimeout(() => document.getElementById('scanner-input').focus(), 300);
            } else { 
                alert("PIN Incorrecto.");
            }
        }

        function pintar() {
            document.getElementById('grid').innerHTML = PRODS.map(p => `
                <div onclick="clickProd('${p.id}', '${p.n}', ${p.p})" class="product-card">
                    <div class="text-emerald-400 font-black text-xs uppercase truncate tracking-widest">${p.id}</div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase leading-tight overflow-hidden h-8">${p.n}</div>
                    <div class="text-emerald-300 font-black text-sm">${['GAS', 'REP', 'ABONO', 'RECARGA'].includes(p.id) ? 'VAR' : '$'+p.p}</div>
                </div>`).join('');
        }

        function clickProd(id, n, p) {
            let idLimpio = String(id).trim().toUpperCase();
            if(idLimpio === 'GAS') {
                const con = prompt("CONCEPTO:");
                const mon = prompt("MONTO:");
                if(con && mon > 0) {
                    const gastoF = parseFloat(mon);
                    enviarManual({ tipo: "GASTO", vendedor: vNom, sucursal: vSuc, concepto: con, monto: gastoF });
                    
                    const gastoNombre = 'GAS: ' + con.toUpperCase().substring(0, 15);
                    if(!corte[gastoNombre]) corte[gastoNombre] = {cant: 0, total: 0};
                    corte[gastoNombre].cant++;
                    corte[gastoNombre].total -= gastoF; 
                    localStorage.setItem('backup_corte', JSON.stringify(corte));
                }
            } else if(idLimpio === 'RECARGA') {
                const num = prompt("TELÉFONO:");
                if (num) {
                    const mon = prompt("MONTO:");
                    if (mon > 0) add(id, "RECARGA: " + num, parseFloat(mon));
                }
            } else if(idLimpio === 'REP' || idLimpio === 'REPARACION') {
                const modelo = prompt("MODELO:");
                if (modelo) {
                    const tipo = prompt("REPARACIÓN:");
                    if (tipo) {
                        const m = prompt("COSTO:");
                        if (m > 0) {
                            add("REPARACION", "REP: " + modelo + " (" + tipo + ")", parseFloat(m), {modelo: modelo, tipoRep: tipo});
                        }
                    }
                }
            } else if(idLimpio === 'ABONO') {
                const m = prompt("MONTO:");
                if(m !== null && m.trim() !== "") {
                    const montoFinal = parseFloat(m);
                    if(montoFinal > 0) {
                        const plat = prompt("PLATAFORMA:");
                        let plataformaFinal = "Efectivo";
                        if(plat !== null && plat.trim() !== "") { plataformaFinal = plat.trim(); }
                        add('ABONO', n, montoFinal, {plataforma: plataformaFinal});
                    } else {
                        alert("El monto debe ser mayor a cero.");
                    }
                }
            } else { 
                add(id, n, p);
            }
        }

        function add(id, n, p, extra = null) { 
            carrito.push({id, n, p, extra});
            localStorage.setItem('backup_venta', JSON.stringify(carrito));
            actualizar(); 
        }

        function actualizar() {
            document.getElementById('carrito').innerHTML = carrito.map((item, i) => `
                <div class="flex justify-between items-center bg-[#1e293b]/80 p-4 rounded-xl text-[11px] border-l-4 border-emerald-500 mb-2 shadow-sm border-r border-t border-b border-slate-700/50">
                    <span class="font-bold truncate w-48 uppercase text-slate-200 tracking-wide">${item.n}</span>
                    <button onclick="del(${i})" class="text-red-400 hover:text-red-300 text-2xl font-light px-2 hover:scale-110 active:scale-90 transition">&times;</button>
                </div>`).join('');
            document.getElementById('t-v').innerText = carrito.reduce((a, b) => a + b.p, 0).toFixed(2);
        }

        function del(i) { carrito.splice(i, 1); localStorage.setItem('backup_venta', JSON.stringify(carrito)); actualizar(); }
        function limpiarVenta() { carrito = []; localStorage.removeItem('backup_venta'); actualizar(); }
        
        function abrirCobro() { 
            if(carrito.length > 0) {
                document.getElementById('modal-cobro').style.display = 'flex';
                setTimeout(() => document.getElementById('pago-cliente').focus(), 100);
            }
        }
        
        function cerrarCobro() { 
            document.getElementById('modal-cobro').style.display = 'none';
            document.getElementById('scanner-input').focus();
        }
        
        function quickPay(n) { document.getElementById('pago-cliente').value = n; calcCambio(); }
        
        function calcCambio() { 
            const t = parseFloat(document.getElementById('t-v').innerText), p = parseFloat(document.getElementById('pago-cliente').value) || 0;
            document.getElementById('cambio-v').innerText = (p - t > 0) ? (p - t).toFixed(2) : "0.00";
        }

        async function finalizarVenta() {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loading').style.opacity = '1';
            
            const agrupado = [];
            carrito.forEach(x => {
                if (x.id === 'ABONO' || x.id === 'RECARGA' || x.id === 'REPARACION') {
                    agrupado.push({codigo: x.id, cantidad: 1, precio: x.p, extra: x.extra});
                } else {
                    let item = agrupado.find(i => i.codigo === x.id);
                    if(item) { item.cantidad++; item.precio += x.p; }
                    else { agrupado.push({codigo: x.id, cantidad: 1, precio: x.p}); }
                }

                if(!corte[x.id]) corte[x.id] = {cant: 0, total: 0};
                corte[x.id].cant++; corte[x.id].total += x.p;
            });
            try {
                const res = await fetch(URL, {method: 'POST', body: JSON.stringify({tipo: "VENTA", sucursal: vSuc, vendedor: vNom, items: agrupado})});
                const result = await res.json();
                
                if(result.status === "ok") {
                    localStorage.setItem('backup_corte', JSON.stringify(corte));
                    localStorage.removeItem('backup_venta');
                    alert("✅ Registro Exitoso");
                    carrito = []; actualizar(); cerrarCobro();
                } else { 
                    throw new Error(result.msg);
                }
            } catch(e) { 
                alert("Error de conexión. Se guardó respaldo local.");
                console.error(e); 
            }
            document.getElementById('loading').style.display = 'none';
        }

        async function enviarManual(data) { 
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loading').style.opacity = '1'; 
            try { 
                await fetch(URL, {method: 'POST', body: JSON.stringify(data)});
                alert("✅ Registro Exitoso");
            } catch(e) { 
                alert("Error al enviar datos.");
            } 
            document.getElementById('loading').style.display = 'none';
        }
        
        async function ajusteInv(modo) { 
            let d = { tipo: "AJUSTE_INV", modo: modo };
            if(modo == "TRASPASO") { 
                d.origen = prompt("ORIGEN:");
                d.destino = prompt("DESTINO:"); 
            } else { 
                d.ubicacion = prompt("SUCURSAL:");
            } 
            d.codigo = prompt("CÓDIGO:"); d.cantidad = prompt("CANTIDAD:");
            if(d.codigo && d.cantidad) enviarManual(d);
        }
        
        async function modalEquipo() { 
            const m = prompt("MODELO:");
            const i = prompt("IMEI:");
            const n = prompt("NÚMERO:");
            const c = prompt("CLIENTE:");
            const e = prompt("ENGANCHE:");
            const p = prompt("PLATAFORMA:");
            const a = prompt("AJUSTE ENGANCHE:");

            if(m && i) {
                enviarManual({ tipo: "EQUIPO", modelo: m, imei: i, numero: n, nombre: c, enganche: e, plataforma: p, ajuste_enganche: a, sucursal: vSuc, vendedor: vNom });
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
            let h = "";
            let tVentas = 0, tAbonos = 0, tGastos = 0, tRecargas = 0, tReparaciones = 0, tTotalCaja = 0;
            for(let id in corte) {
                let isGas = id.startsWith('GAS:');
                let isAbono = id === 'ABONO';
                let isRecarga = id === 'RECARGA';
                let isReparacion = id === 'REPARACION';
                let isNeg = corte[id].total < 0;
                
                let colorClass = isGas ? "text-red-400" : (isAbono ? "text-emerald-400" : (isRecarga ? "text-teal-400" : (isReparacion ? "text-emerald-300" : "text-slate-300")));
                let montoFormat = isNeg ? "-$" + Math.abs(corte[id].total).toFixed(2) : "$" + corte[id].total.toFixed(2);
                
                h += `<div class="flex justify-between border-b py-3 italic font-black uppercase text-xs ${colorClass} border-slate-700/50"><span>${corte[id].cant}x ${id}</span><span>${montoFormat}</span></div>`;
                if(isGas) { tGastos += Math.abs(corte[id].total); }
                else if(isAbono) { tAbonos += corte[id].total; }
                else if (isRecarga) { tRecargas += corte[id].total; }
                else if (isReparacion) { tReparaciones += corte[id].total; }
                else { tVentas += corte[id].total; }
                
                tTotalCaja += corte[id].total;
            }

            document.getElementById('corte-lista').innerHTML = h || "<p class='text-center py-10 opacity-30 text-sm'>Aún no hay movimientos</p>";
            
            let breakdownHTML = `
                <div class="text-xs text-slate-400 flex justify-between uppercase mb-2"><span>Accesorios:</span><span class="text-slate-200">$${tVentas.toFixed(2)}</span></div>
                <div class="text-xs text-emerald-300/80 flex justify-between uppercase mb-2"><span>Reparaciones:</span><span class="text-emerald-300">$${tReparaciones.toFixed(2)}</span></div>
                <div class="text-xs text-emerald-400/80 flex justify-between uppercase mb-2"><span>Abonos:</span><span class="text-emerald-400">$${tAbonos.toFixed(2)}</span></div>
                <div class="text-xs text-teal-400/80 flex justify-between uppercase mb-2"><span>Recargas:</span><span class="text-teal-400">$${tRecargas.toFixed(2)}</span></div>
                <div class="text-xs text-red-400/80 flex justify-between uppercase mb-3"><span>Gastos:</span><span class="text-red-400">-$${tGastos.toFixed(2)}</span></div>
                <div class="border-t border-slate-700 pt-3 text-[10px] text-slate-400 font-bold uppercase tracking-widest text-center mt-3">Efectivo Total Físico</div>
                <div class="text-emerald-400 text-4xl font-black text-center mt-2 tracking-tighter">$${tTotalCaja.toFixed(2)}</div>
            `;
            document.getElementById('total-corte').innerHTML = breakdownHTML;
            window.cortePuro = tVentas.toFixed(2);
        }

        async function enviarCorte() {
            const t = window.cortePuro || "0.00";
            if(confirm(`¿Cerrar turno oficial? Esto limpiará la pantalla para el siguiente turno.`)) {
                document.getElementById('loading').style.display = 'flex';
                try {
                    await fetch(URL, {method: 'POST', body: JSON.stringify({tipo: "VENTA", sucursal: vSuc, vendedor: vNom, items: [], corteX: t})});
                    localStorage.removeItem('backup_corte'); 
                    window.location.reload();
                } catch(e) { 
                    alert("Error al cerrar turno.");
                }
                document.getElementById('loading').style.display = 'none';
            }
        }

        // ==========================================
        // --- MOTOR DEL ESCÁNER LÁSER CREDICEL ---
        // ==========================================
        const scannerInput = document.getElementById('scanner-input');
        
        // Mantener el escáner listo para recibir el láser si teclean fuera (Evita errores humanos)
        document.addEventListener('keydown', (e) => {
            const isModalOpen = document.getElementById('modal-login').style.display !== 'none' || document.getElementById('modal-cobro').style.display === 'flex';
            if (!isModalOpen && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                scannerInput.focus();
            }
        });

        // Detectar el disparo del escáner
        scannerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // Evita recargar la página
                let cod = scannerInput.value.trim().toUpperCase();
                scannerInput.value = ''; // Limpiar barra para el siguiente producto rápido
                
                if (cod !== '') {
                    // Buscar el código en el inventario cargado
                    let prod = PRODS.find(x => String(x.id).trim().toUpperCase() === cod);
                    
                    if (prod) {
                        // Enviar al carrito de la misma forma en la que daban clic manual
                        clickProd(prod.id, prod.n, prod.p);
                    } else {
                        // Alerta si escanean algo que no existe
                        alert("⚠️ CÓDIGO NO REGISTRADO EN INVENTARIO: " + cod);
                    }
                }
            }
        });
        // ==========================================
    </script>
</body>
</html>
